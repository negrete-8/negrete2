name: DevSecOps Pipeline - Titan (COMPLETO)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # ============================================
      # GITLEAKS
      # ============================================
      - name: Gitleaks
        uses: zricethezav/gitleaks-action@v1.6.0
        continue-on-error: true

      # ============================================
      # SNYK
      # ============================================
      - name: Install system dependencies and Snyk
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev
          pip install --no-cache-dir -r requirements.txt
          npm install -g snyk

      - name: Snyk Test
        id: snyk
        run: snyk test --severity-threshold=high
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Install snyk-to-html
        if: always()
        run: npm install -g snyk-to-html@1.4.0

      - name: Generate Snyk HTML Report
        if: always()
        run: |
          snyk test --severity-threshold=high --json > snyk-report.json || true
          snyk-to-html -i snyk-report.json -o snyk-report.html || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # ============================================
      # SONARCLOUD (con análisis manual)
      # ============================================
      - name: SonarCloud Scan
        id: sonar
        uses: sonarsource/sonarqube-scan-action@master
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=negrete-8
            -Dsonar.projectKey=negrete-8_negrete2
            -Dsonar.sources=.
            -Dsonar.python.version=3.9
            -Dsonar.exclusions=**/tests/**,**/venv/**,**/__pycache__/**

      # ============================================
      # ZAP - VERSIÓN MEJORADA
      # ============================================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies for ZAP
        run: |
          pip install python-owasp-zap-v2.4 requests

      - name: Build and Run Titan App
        run: |
          echo "🔨 Construyendo imagen Docker..."
          docker build -t titan-app .
          
          echo "🚀 Ejecutando contenedor..."
          docker run -d --name titan-app --network host \
            -e TITAN_ID="github-action-$(date +%s)" \
            titan-app
          
          echo "⏳ Esperando 30 segundos a que la app arranque..."
          sleep 30
          
          echo "📋 LOGS DEL CONTENEDOR:"
          docker logs titan-app
          
          echo "🔍 Verificando que la app responde..."
          curl -I http://localhost:5000 || echo "⚠️ App no responde"

      - name: Run ZAP
        run: |
          docker run -d --name zap --network host -v $(pwd):/zap/wrk:rw \
            zaproxy/zap-stable \
            zap.sh -daemon -host 0.0.0.0 -port 8080 \
            -config api.key=${{ secrets.ZAP_API_KEY }} \
            -config api.disablekey=true
          echo "⏳ Esperando 45 segundos a que ZAP arranque..."
          sleep 45
          echo "✅ ZAP corriendo en http://localhost:8080"

      - name: ZAP Scan (Completo)
        id: zap
        run: python zap_scan.py
        continue-on-error: true
        env:
          ZAP_API_KEY: ${{ secrets.ZAP_API_KEY }}

      # ============================================
      # ARTIFACTS
      # ============================================
      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.html
          if-no-files-found: warn

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report-completo
          path: zap-report.html
          if-no-files-found: warn

      # ============================================
      # VERIFICACIÓN FINAL
      # ============================================
      - name: Verificar resultados
        if: always()
        run: |
          EXIT_CODE=0
          
          echo "=== RESUMEN DE SEGURIDAD ==="
          echo ""
          
          # Gitleaks
          if [[ "${{ steps.gitleaks.outcome }}" == "failure" ]]; then
            echo "❌ Gitleaks: Se encontraron secretos"
            EXIT_CODE=1
          else
            echo "✅ Gitleaks: No hay secretos"
          fi
          
          # Snyk
          if [[ "${{ steps.snyk.outcome }}" == "failure" ]]; then
            echo "❌ Snyk: Vulnerabilidades HIGH en dependencias"
            EXIT_CODE=1
          else
            echo "✅ Snyk: No hay vulnerabilidades HIGH"
          fi
          
          # SonarCloud
          if [[ "${{ steps.sonar.outcome }}" == "failure" ]]; then
            echo "❌ SonarCloud: Calidad de código deficiente (revisar)"
            EXIT_CODE=1
          else
            echo "✅ SonarCloud: Quality Gate OK"
          fi
          
          # ZAP
          if [[ "${{ steps.zap.outcome }}" == "failure" ]]; then
            echo "❌ ZAP: Se encontraron vulnerabilidades HIGH"
            EXIT_CODE=1
          else
            echo "⚠️ ZAP: No se encontraron HIGH (revisar reporte)"
          fi
          
          echo ""
          echo "📊 Reportes disponibles en Artifacts"
          echo ""
          
          exit $EXIT_CODE

      # ============================================
      # NOTIFICACIÓN
      # ============================================
      - name: Notificación
        if: always()
        run: |
          echo "========================================"
          echo "🚀 Pipeline Titan completado"
          echo "📊 Reportes en Actions → Artifacts"
          echo "📌 SonarCloud: https://sonarcloud.io/project/overview?id=negrete-8_negrete2"
          echo "========================================"
