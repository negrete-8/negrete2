name: DevSecOps Pipeline - Titan

on:
  push:
    branches: [main, master, mejora-zap]
  pull_request:
    branches: [main, master]

jobs:
  security-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- SECRET DETECTION ----------
      - name: Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- SCA (Snyk) ----------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev jq
          pip install --no-cache-dir -r requirements.txt
          npm install -g snyk snyk-to-html@1.4.0

      - name: Snyk Test
        id: snyk
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --severity-threshold=high --json > snyk-report.json || true
          snyk-to-html -i snyk-report.json -o snyk-report.html || true
          HIGH_COUNT=$(jq '[.vulnerabilities[]? | select(.severity=="high" or .severity=="critical")] | length' snyk-report.json 2>/dev/null || echo 0)
          echo "high_count=$HIGH_COUNT" >> $GITHUB_OUTPUT
          [ "$HIGH_COUNT" -eq 0 ]

      # ---------- SAST (SonarCloud) ----------
      - name: SonarCloud Scan
        id: sonar
        uses: SonarSource/sonarqube-scan-action@v4
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=negrete-8
            -Dsonar.projectKey=negrete-8_negrete2
            -Dsonar.sources=.
            -Dsonar.python.version=3.10
            -Dsonar.exclusions=**/tests/**,**/venv/**,**/__pycache__/**,**/templates/**

      # ---------- DAST (OWASP ZAP) ----------
      - name: Install ZAP client
        run: pip install python-owasp-zap-v2.4 requests

      - name: Build & run Titan app
        run: |
          docker build -t titan-app .
          docker run -d --name titan-app --network host \
            -e TITAN_ID="gh-${{ github.run_id }}" \
            titan-app
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5000/login >/dev/null; then
              echo "App ready after ${i}*2s"
              break
            fi
            sleep 2
          done
          docker logs titan-app | tail -30

      - name: Start ZAP
        run: |
          docker run -d --name zap --network host \
            -v $(pwd):/zap/wrk:rw \
            zaproxy/zap-stable \
            zap.sh -daemon \
              -host 0.0.0.0 -port 8080 \
              -config api.disablekey=true \
              -config api.addrs.addr.name=.* \
              -config api.addrs.addr.regex=true
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/JSON/core/view/version/ >/dev/null; then
              echo "ZAP ready after ${i}*2s"
              break
            fi
            sleep 2
          done

      - name: ZAP active scan
        id: zap
        continue-on-error: true
        env:
          ZAP_API_KEY: ""
        run: python zap_scan.py

      - name: Stop containers
        if: always()
        run: |
          docker logs zap | tail -50 || true
          docker rm -f zap titan-app || true

      # ---------- ARTIFACTS ----------
      - name: Upload Snyk report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: |
            snyk-report.html
            snyk-report.json
          if-no-files-found: warn

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-report.html
            zap-report.xml
            zap-summary.json
          if-no-files-found: warn

      # ---------- SUMMARY ----------
      - name: Pipeline summary
        if: always()
        run: |
          {
            echo "## DevSecOps Pipeline Summary"
            echo ""
            echo "| Stage | Outcome |"
            echo "|-------|---------|"
            echo "| Gitleaks | ${{ steps.gitleaks.outcome }} |"
            echo "| Snyk (high+) | ${{ steps.snyk.outcome }} (count: ${{ steps.snyk.outputs.high_count }}) |"
            echo "| SonarCloud | ${{ steps.sonar.outcome }} |"
            echo "| ZAP DAST | ${{ steps.zap.outcome }} |"
            echo ""
            if [ -f zap-summary.json ]; then
              echo "### ZAP findings"
              jq -r '"High: \(.high)  ·  Medium: \(.medium)  ·  Low: \(.low)  ·  Info: \(.info)"' zap-summary.json
              echo ""
              echo "### HIGH risk findings"
              jq -r '.high_alerts[] | "- **\(.name)** at `\(.url)` (param `\(.param)`, CWE \(.cwe))"' zap-summary.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any high-risk findings
        if: always()
        run: |
          FAIL=0
          if [ "${{ steps.snyk.outcome }}" = "failure" ]; then
            echo "::error::Snyk found HIGH/CRITICAL dependency vulnerabilities"
            FAIL=1
          fi
          if [ "${{ steps.zap.outcome }}" = "failure" ]; then
            echo "::error::ZAP found HIGH risk findings in the app"
            FAIL=1
          fi
          if [ "${{ steps.gitleaks.outcome }}" = "failure" ]; then
            echo "::error::Gitleaks detected secrets in the repository"
            FAIL=1
          fi
          exit $FAIL
